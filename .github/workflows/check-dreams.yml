name: Verify 300 Dream Pages
on:
  push:
    paths:
      - 'build.py'
      - 'dream_catalog.py'
      - 'dream_data/**'
      - 'tests/**'
      - '.github/workflows/check-dreams.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q build.py dream_catalog.py fortune_extra.py
      - name: Generate pages and verify
        env:
          SITE_URL: https://kkultip-dosa.netlify.app
        run: python tests/test_dreams.py
